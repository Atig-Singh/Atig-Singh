<svg width="620" height="340" viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg">
<rect width="620" height="340" rx="10" fill="#0d1117"/>
<defs>
  <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0ea5e9"/>
    <stop offset="100%" stop-color="#39FF14"/>
  </linearGradient>
  <g id="ticks">
    <g stroke="#484f58" stroke-width="2">
      <line x1="0" y1="-32" x2="0" y2="-26" transform="rotate(-135)" />
      <line x1="0" y1="-32" x2="0" y2="-26" transform="rotate(-67.5)" />
      <line x1="0" y1="-32" x2="0" y2="-26" transform="rotate(0)" />
      <line x1="0" y1="-32" x2="0" y2="-26" transform="rotate(67.5)" />
      <line x1="0" y1="-32" x2="0" y2="-26" transform="rotate(135)" />
    </g>
  </g>
</defs>

<!-- Dial 1 -->
<g transform="translate(103, 100)">
  <circle cx="0" cy="0" r="40" fill="none" stroke="#1f2630" stroke-width="8" stroke-dasharray="188.5 251.3" transform="rotate(135)"/>
  <circle cx="0" cy="0" r="40" fill="none" stroke="url(#barGrad)" stroke-width="8" stroke-dasharray="188.5 251.3" stroke-dashoffset="188.5" stroke-linecap="round" transform="rotate(135)">
    <animate attributeName="stroke-dashoffset" values="188.5; 0; 18.85; 18.85; 188.5" keyTimes="0; 0.136; 0.227; 0.864; 1" dur="11s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 1 0 1 1; 0.4 0 0.2 1"/>
  </circle>
  <use href="#ticks" />
  <g transform="rotate(-135)">
    <animateTransform attributeName="transform" type="rotate" values="-135; 135; 108; 108; -135" keyTimes="0; 0.136; 0.227; 0.864; 1" dur="11s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 1 0 1 1; 0.4 0 0.2 1"/>
    <polygon points="-2.5,0 2.5,0 0,-30" fill="#ffffff"/>
    <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
    <circle cx="0" cy="0" r="1.5" fill="#0d1117"/>
  </g>
  <text x="0" y="28" font-family="JetBrains Mono, monospace" font-size="13" font-weight="bold" fill="#39FF14" text-anchor="middle">90%</text>
  <text x="0" y="65" font-family="JetBrains Mono, monospace" font-size="12" fill="#c9d1d9" text-anchor="middle">Python / PyTorch</text>
</g>

